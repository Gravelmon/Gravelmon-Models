name: Models source

# Run by hand. Chooses what the Gravelmon mod downloads as its models, and tells clients to download again.
#
#   tag_only = true   the archive of the published tag `v<x.y.z>` (the release behaviour; a tag never moves).
#   tag_only = false  the archive of `branch` as it is right now, for any mod version and with no tag needed. Use this
#                     while the models are still being fixed.
#
# Switching `tag_only` or `branch` makes every client download again on its next start. With `refresh` ticked the clients
# download again as well, even if nothing was switched: run it each time you want players to get the latest files.
# Clients that are already current (same number as the site) do nothing.
#
# Calls POST /api/internal/models-source. The status route (about 60 seconds of cache) then reports `refreshRevision`.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   secrets:   POKEMON_STATUS_INTERNAL_TOKEN

on:
  workflow_dispatch:
    inputs:
      tag_only:
        description: "Download only the published tag (true) or the current branch (false). Leave empty to keep the current setting."
        required: false
        type: choice
        options: ["", "true", "false"]
      branch:
        description: "Branch to download when tag_only is false. Leave empty to keep the current one (main by default)."
        required: false
      refresh:
        description: "Make every client download again on its next start."
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  models-source:
    runs-on: ubuntu-latest
    steps:
      - name: Update the models source
        env:
          TAG_ONLY: ${{ github.event.inputs.tag_only }}
          BRANCH: ${{ github.event.inputs.branch }}
          REFRESH: ${{ github.event.inputs.refresh }}
          TOKEN: ${{ secrets.POKEMON_STATUS_INTERNAL_TOKEN }}
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            const request = {};
            if (process.env.TAG_ONLY) request.tagOnly = process.env.TAG_ONLY === "true";
            if (process.env.BRANCH?.trim()) request.branch = process.env.BRANCH.trim();
            if (process.env.REFRESH === "true") request.refresh = true;
            if (Object.keys(request).length === 0) throw new Error("Nothing to do: set tag_only, branch or refresh.");
            const body = JSON.stringify(request);
            const response = await fetch("https://submit.gravelmon.com/api/internal/models-source", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-Gravelmon-Token": `Bearer ${process.env.TOKEN}`,
                "x-amz-content-sha256": createHash("sha256").update(body).digest("hex"),
              },
              body,
            });
            console.log(response.status, await response.text());
            if (!response.ok) process.exit(1);
          '
