name: Sync credits

# Moved here from the Mod repo's `gravelmon-sync.yml` (plan, section 1). A submission's assets travel
# holding branch -> version branch (e.g. `4.1.0`) -> main. Every hop re-runs the sync so the pokemon
# index records which branch the assets now live on, but only the first hop (the submission's own PR
# into the holding branch) is credited: see `isInitialHop` in the script.
#
# What changed from the Mod's workflow: the credits files are `<game>/<folder>/credits.json`, and the
# `-previews` branch deletion moved to `cleanup-previews.yml` (it runs when the PR is closed).
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   secrets:   POKEMON_STATUS_INTERNAL_TOKEN

on:
  push:
    branches:
      - "[0-9]*.[0-9]*.[0-9]*"
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch the assets now live on (defaults to the branch this is run on)"
        required: false
      before:
        description: "Commit SHA before the change (diff base)"
        required: true
      after:
        description: "Commit SHA after the change"
        required: true
      pr_number:
        description: "PR number to award points for (optional)"
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update model status and award points
        env:
          GRAVELMON_API_DOMAIN: https://submit.gravelmon.com
          POKEMON_STATUS_INTERNAL_TOKEN: ${{ secrets.POKEMON_STATUS_INTERNAL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.inputs.before || github.event.before }}
          AFTER_SHA: ${{ github.event.inputs.after || github.sha }}
          # `main` is the branch submissions land on, so it is the "holding" branch of the script.
          HOLDING_BRANCH: main
          # Only the initial PR into main is credited (decided in the script); a manual
          # run credits the PR number it is given.
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          ASSET_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
        run: node scripts/sync-credits.mjs
