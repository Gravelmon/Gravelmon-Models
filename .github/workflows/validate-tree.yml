name: Validate tree

# Checks every pull request's tree with the same validators the migration and `tag-version.yml` use:
# every form folder (`<game>/<name>/`) has a valid install.json; every file has an entry and every
# entry a file; every `uses` target exists; no two folders install to the same path (a shared file is
# stored once, in its owner's folder).
#
# The validator comes from the BASE branch (checked out beside the PR's tree), so a PR cannot weaken
# the rules it is checked against. No secrets are needed.
#
# Submissions accepted on the website reach main without a pull request, so the whole tree of main is
# also checked once a week (and by hand with "Run workflow"). A failed run is the signal to fix it.

on:
  pull_request:
    branches:
      - "[0-9]*.[0-9]*.[0-9]*"
      - main
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validator (base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: trusted
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      # A pull request's tree, or (on the schedule) main's.
      - name: Check out the tree
        uses: actions/checkout@v4
        with:
          path: tree

      - name: Validate the tree
        run: node trusted/scripts/validate-tree.mjs tree
