name: Clean up previews

# The wizard commits a submission's animation GIFs to a branch of this repository next to the
# submission's own branch: `submit/<game>-<pokemon>-<timestamp>-previews`. It is never merged. Once the
# pull request is closed, merged or not, the branch has nothing left to show and is deleted. Editing a
# submission pushes a new preview branch, so the ones the description links to are deleted too.
#
# Only branches named exactly like a preview branch are touched (never `main`, the holding branch,
# version branches or submission branches), and only for a pull request the Gravelmon GitHub App
# opened. A branch that is already gone is not an error. Re-run by hand with "Run workflow" and the PR
# number (the PR must be closed).
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   variables: GRAVELMON_APP_LOGIN   the App's bot login, for example `gravelmon-submissions[bot]`

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Closed pull request whose preview branches to delete"
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Delete the preview branches
        env:
          GRAVELMON_APP_LOGIN: ${{ vars.GRAVELMON_APP_LOGIN }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: node scripts/cleanup-previews.mjs
